<!DOCTYPE html>
{% load static %}
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Device Dashboard – {{ device_id }}</title>
  <link rel="stylesheet" href="{% static 'ppg/css/dashboard.css' %}">
  <script src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; }
    #appRoot { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    .header { flex:0 0 auto; }
    .meta-bar { display:flex; gap:12px; align-items:center; margin:6px 20px 0; flex:0 0 auto; }
    .pill { background:#f3f4f6; padding:4px 10px; border-radius:999px; font-size:12px; }
    .kpis { flex:0 0 auto; padding:6px 20px; display:flex; gap:16px; align-items:center; }
    .kpi { display:flex; flex-direction:column; }
    .kpi-label { font-size:11px; color:#6b7280; }
    .kpi-value { font-size:15px; font-weight:700; color:#111827; }
    .grid-split {
      display:grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1.8fr);
      gap:14px; padding:8px 20px 12px;
      flex:1; min-height:0; align-items:stretch;
    }
    .grid-left  { display:flex; flex-direction:column; gap:10px; min-height:0; }
    .grid-right { display:flex; flex-direction:column; min-height:0; }
    .grid-right .card { flex:1; min-height:0; display:flex; flex-direction:column; padding:10px; }
    .chart-box { flex:1; min-height:0; width:100%; }
    .card { background:#fff; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.08); }
    /* ── IMU 위험 레벨 카드 ── */
    .imu-card {
      --imu-lv1:#e2e8f0; --imu-lv2:#f6e3c6; --imu-lv3:#ecb06c; --imu-lv4:#b84a20; --imu-lv5:#8c2a22;
      --imu-empty:#f1f3f6;
      flex:0 0 auto; min-height:0; padding:14px 18px 16px;
      display:flex; flex-direction:column; gap:12px;
    }
    .imu-card [data-level="1"] { --lv-bg:var(--imu-lv1); --lv-fg:#334155; --lv-bd:#cbd5e1; }
    .imu-card [data-level="2"] { --lv-bg:var(--imu-lv2); --lv-fg:#7c4a12; --lv-bd:var(--imu-lv2); }
    .imu-card [data-level="3"] { --lv-bg:var(--imu-lv3); --lv-fg:#4a2706; --lv-bd:var(--imu-lv3); }
    .imu-card [data-level="4"] { --lv-bg:var(--imu-lv4); --lv-fg:#ffffff; --lv-bd:var(--imu-lv4); }
    .imu-card [data-level="5"] { --lv-bg:var(--imu-lv5); --lv-fg:#ffffff; --lv-bd:var(--imu-lv5); }

    .imu-card__title { font-size:17px; font-weight:800; color:#111827; }
    .imu-card__top   { display:flex; gap:20px; align-items:center; }

    .imu-tile {
      flex:0 0 auto; width:clamp(110px, 30%, 168px); aspect-ratio:1;
      border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:var(--lv-bg, var(--imu-empty)); color:var(--lv-fg, #9ca3af);
      transition:background .3s, color .3s;
    }
    .imu-tile__num   { font-size:clamp(48px, 5vw, 76px); font-weight:900; line-height:1; }
    .imu-tile__label { font-size:clamp(13px, 1.2vw, 18px); font-weight:800; margin-top:6px; text-align:center; }

    .imu-scale        { flex:1; min-width:0; }
    .imu-scale__title { font-size:13px; font-weight:700; color:#374151; margin-bottom:8px; }
    .imu-scale__list  { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; }
    .imu-scale__item  { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:help; }
    .imu-scale__chip  {
      width:100%; height:18px; border-radius:7px;
      background:var(--lv-bg); border:1px solid var(--lv-bd); box-sizing:border-box;
      transition:box-shadow .2s;
    }
    .imu-scale__name  { font-size:12px; color:#6b7280; text-align:center; line-height:1.3; word-break:keep-all; }
    .imu-scale__item.is-active .imu-scale__chip { box-shadow:0 0 0 2px #fff, 0 0 0 4px #111827; }
    .imu-scale__item.is-active .imu-scale__name { color:#111827; font-weight:800; }
    .imu-scale__desc  { margin-top:10px; font-size:12px; color:#374151; line-height:1.4; }
    .imu-card.is-threat .imu-scale__desc { color:#8c2a22; font-weight:700; }
    .imu-ts           { margin-top:2px; font-size:11px; color:#9ca3af; }

    .imu-timeline__labels { display:flex; justify-content:space-between; font-size:11px; color:#6b7280; margin-bottom:6px; }
    .imu-timeline__bars {
      height:84px; padding:8px; border-radius:10px; background:#f8fafc;
      display:grid; grid-template-columns:repeat(30, 1fr); gap:3px; align-items:end;
    }
    .imu-bar { height:100%; display:flex; align-items:flex-end; }
    .imu-bar__fill {
      width:100%; border-radius:4px;
      background:var(--lv-bg); border:1px solid var(--lv-bd); box-sizing:border-box;
      transition:height .3s ease, background .3s;
    }
    .imu-bar.is-empty .imu-bar__fill { height:3px !important; background:#e5e7eb; border:none; }
    #wearCard {
      flex:1; display:flex; flex-direction:column; padding:16px;
      box-sizing:border-box; text-align:center; min-height:0;
    }
    #wearCard .wear-card__top    { flex:0 0 auto; }
    #wearCard .wear-card__bottom {
      flex:1; display:flex; align-items:center; justify-content:center;
      overflow:hidden; padding:8px 0; min-height:0;
    }
    #wearCard .wear-card__bottom > img { max-height:100%; max-width:100%; object-fit:contain; }
    .wear-card__title  { font-size:12px; color:#6b7280; font-weight:600; margin-bottom:4px; }
    .wear-card__status { font-size:24px; font-weight:700; margin-bottom:4px; }
    .wear-card__meta   { font-size:10px; color:#4b5563; }
    #wearCard.is-wear .wear-card__status { color:#10b981; }
    #wearCard.is-off  .wear-card__status { color:#ef4444; }
    #wearCard.is-unk  .wear-card__status { color:#9ca3af; }
  </style>
</head>
<body>
<div id="appRoot">
  <header class="header">
    <h1>Integrated Threat Monitor</h1>
    <img class="logo" src="{% static 'ppg/image/logo.png' %}" alt="logo">
  </header>

  <div class="meta-bar">
    <div class="pill"><b>User</b>: {{ protectee_name }}</div>
    <div class="pill"><b>Device</b>: {{ device_id }}</div>
  </div>

  <div class="kpis">
    <div class="kpi">
      <span class="kpi-label">Baseline</span>
      <span class="kpi-value" id="kpiBaseline">대기 중...</span>
    </div>
    <div class="kpi">
      <span class="kpi-label">데이터 지연</span>
      <span class="kpi-value" id="delayText">-</span>
    </div>
  </div>

  <div class="grid-split">
    <div class="grid-left">
      <div id="imuCard" class="card imu-card is-empty">
        <div class="imu-card__title">IMU 위험 레벨</div>
        <div class="imu-card__top">
          <div id="imuTile" class="imu-tile">
            <div id="imuTileNum"   class="imu-tile__num">–</div>
            <div id="imuTileLabel" class="imu-tile__label">데이터 없음</div>
          </div>
          <div class="imu-scale">
            <div class="imu-scale__title">현재 단계</div>
            <ol id="imuScale" class="imu-scale__list"></ol>
            <div id="imuDesc" class="imu-scale__desc"></div>
            <div id="imuTs"   class="imu-ts"></div>
          </div>
        </div>
        <div class="imu-timeline">
          <div class="imu-timeline__labels">
            <span>3분 전</span><span>6초 단위 레벨 변화</span><span>지금</span>
          </div>
          <div id="imuBars" class="imu-timeline__bars"></div>
        </div>
      </div>

      <div id="wearCard" class="card wear-card is-unk" style="flex:1;">
        <div class="wear-card__top">
          <div class="wear-card__title">탈부착 여부</div>
          <div class="wear-card__status" id="wearStatusText">--</div>
          <div class="wear-card__meta"   id="wearStatusMeta"></div>
        </div>
        <div class="wear-card__bottom">
          <img id="wearStateImage"
               src="{% static 'ppg/image/loading.png' %}"
               alt="wear state">
        </div>
      </div>
    </div>

    <div class="grid-right">
      <div class="card">
        <div id="irHoldingChart" class="chart-box"></div>
        <p id="irHoldingMeta" class="decision"></p>
      </div>
    </div>
  </div>
</div>

{{ items|json_script:"items-json" }}
<script>
  window.ITEMS          = JSON.parse(document.getElementById('items-json').textContent || '[]');
  window.DASH_DEVICE_ID = "{{ device_id|escapejs }}";
</script>
<!-- ?v=: 정적 파일 수정 시 값을 올려 브라우저 캐시 우회 -->
<script type="module" src="{% static 'ppg/js/main_device.js' %}?v=20261013"></script>
</body>
</html>
